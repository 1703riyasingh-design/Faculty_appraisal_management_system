{% extends "base.html" %}
{% block content %}

<div class="form-card">
    <h3>Consultancy / Patent / Award (5 Marks)</h3>

    <form method="post">

        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group">
            <label>Grant Amount (Rs.)</label>
            <input type="number" step="0.01" name="grant_amount" required>
        </div>

        <button type="submit">Save</button>

    </form>
</div>

{% endblock %}
