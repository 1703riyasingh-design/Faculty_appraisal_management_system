{% extends "base.html" %}
{% block content %}

<style>
body {
    background-color: #f4f6f9;
}

.card {
    width: 65%;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: #2c3e50;
}

.faculty-info {
    margin-bottom: 20px;
    font-size: 18px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

input[type="number"] {
    width: 80px;
    padding: 5px;
}

textarea {
    width: 100%;
    height: 80px;
    padding: 5px;
}

button {
    background-color: green;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: darkgreen;
}
</style>

<div class="card">

<h2>ACR by HOD (20 Marks)</h2>

<div class="faculty-info">
    <p><strong>Faculty Name:</strong> {{ data.name }}</p>
    <p><strong>Designation:</strong> {{ data.designation }}</p>
</div>

<form method="POST">

<div class="form-group">
<label>Responsibility (1-4)</label>
<input type="number" name="responsibility" min="1" max="4" required>
</div>

<div class="form-group">
<label>Punctuality (1-4)</label>
<input type="number" name="punctuality" min="1" max="4" required>
</div>

<div class="form-group">
<label>Commitment (1-4)</label>
<input type="number" name="commitment" min="1" max="4" required>
</div>

<div class="form-group">
<label>Teamwork (1-4)</label>
<input type="number" name="teamwork" min="1" max="4" required>
</div>

<div class="form-group">
<label>Relationship (1-4)</label>
<input type="number" name="relationship" min="1" max="4" required>
</div>

<div class="form-group">
<label>Remark</label>
<textarea name="hod_remark" required></textarea>
</div>

<div style="text-align:center;">
<button type="submit">Submit HOD Review</button>
</div>

</form>

</div>

{% endblock %}
